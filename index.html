<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115" id="tc">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MissionIIT">
<title>Mission IIT 2028</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[data-theme=bw]{--bg:#f3f5fa;--card:#fff;--text:#111827;--mut:#6b7280;--line:#e8ebf2;--hdr:#0f1115;--hdrt:#fff;--acc:#7c3aed;--acc2:#6366f1;--soft:#f1ebff;--inp:#f6f7fb;--ok:#10b981;--bad:#ef4444;--okbg:#ecfdf5}
[data-theme=violet]{--bg:#f5f1ff;--card:#fff;--text:#1e1338;--mut:#6f6590;--line:#e9e1fb;--hdr:#4c1d95;--hdrt:#fff;--acc:#7c3aed;--acc2:#a855f7;--soft:#f1e8ff;--inp:#f7f3ff;--ok:#10b981;--bad:#ef4444;--okbg:#ecfdf5}
[data-theme=red]{--bg:#fff5f5;--card:#fff;--text:#2a1114;--mut:#80585c;--line:#f6dfe0;--hdr:#7f1d1d;--hdrt:#fff;--acc:#dc2626;--acc2:#f43f5e;--soft:#ffe9ea;--inp:#fff7f7;--ok:#10b981;--bad:#b91c1c;--okbg:#ecfdf5}
[data-theme=brown]{--bg:#faf5ef;--card:#fff;--text:#2b1a10;--mut:#7d6757;--line:#efe3d4;--hdr:#3b2314;--hdrt:#fff;--acc:#92400e;--acc2:#b45309;--soft:#fbeedd;--inp:#fcf8f3;--ok:#10b981;--bad:#dc2626;--okbg:#ecfdf5}
[data-theme=classic]{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--mut:#64748b;--line:#e2e8f0;--hdr:#fff;--hdrt:#0f172a;--acc:#2563eb;--acc2:#3b82f6;--soft:#e8f0ff;--inp:#f6f8fb;--ok:#10b981;--bad:#ef4444;--okbg:#ecfdf5}
[data-theme=oled]{--bg:#000;--card:#0e0e12;--text:#f3f4f6;--mut:#9aa1b0;--line:#1e222c;--hdr:#000;--hdrt:#fff;--acc:#8b5cf6;--acc2:#6366f1;--soft:#1a1530;--inp:#15161c;--ok:#34d399;--bad:#f87171;--okbg:#07261c}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Roboto,sans-serif;font-size:14px;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{flex:none;background:var(--hdr);color:var(--hdrt);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid rgba(128,128,128,.18);z-index:5}
.hr1{display:flex;align-items:center;gap:10px}
.hb{width:42px;height:42px;border-radius:12px;border:0;background:rgba(128,128,128,.2);color:inherit;font-size:20px;display:grid;place-items:center;flex:none;cursor:pointer;transition:transform .15s}
.hb:active{transform:scale(.9)}
.fab{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;z-index:30;background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:0 6px 18px -6px rgba(0,0,0,.3)}
.ht{flex:1;min-width:0}
.ht b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht small{display:block;opacity:.7;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{flex:none;border:1px solid rgba(128,128,128,.35);border-radius:10px;padding:6px 9px;font:600 11px ui-monospace,Menlo,monospace}
.hr2{display:flex;justify-content:space-between;margin-top:8px;padding-top:7px;border-top:1px solid rgba(128,128,128,.2);font-size:10.5px;opacity:.85}
.hr2 a{text-decoration:underline;cursor:pointer}
#main{padding-top:calc(env(safe-area-inset-top) + 62px);flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:600px;margin:0 auto;padding:0 12px 60px;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 6px 18px -10px rgba(0,0,0,.08)}
h2.t{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px}
.sub{color:var(--mut);font-size:11.5px;margin-top:2px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.wr{flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{margin-top:12px}.mt8{margin-top:8px}
.btn{border:0;border-radius:12px;padding:10px 14px;font:700 12.5px inherit;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));cursor:pointer;transition:transform .12s,opacity .2s;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.sec{background:var(--inp);color:var(--text);border:1px solid var(--line)}
.btn.dan{background:var(--bad)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:11.5px;border-radius:10px}
.btn.blk{width:100%}
.ib{border:1px solid var(--line);background:var(--inp);color:var(--text);border-radius:10px;min-width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:14px;flex:none;transition:transform .12s}
.ib:active{transform:scale(.9)}
input,select,textarea{width:100%;min-width:0;font:500 13.5px inherit;font-family:inherit;color:var(--text);background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
textarea{resize:vertical;min-height:84px}
label.l{display:block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:12px 0 5px}
.seg{display:flex;background:var(--inp);border-radius:13px;padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);font:700 12px inherit;font-family:inherit;padding:9px 10px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:all .2s}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 12px -4px var(--acc)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--inp);color:var(--mut);border:1px solid var(--line)}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.chip.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--soft);color:var(--acc);border-color:transparent}
.bar{height:7px;border-radius:9px;background:var(--inp);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stat{background:var(--inp);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;min-width:0}
.stat small{display:block;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.stat b{display:block;font-size:19px;font-weight:800;margin-top:3px}
.stat em{display:block;font-style:normal;font-size:9.5px;color:var(--mut);margin-top:1px}
.empty{text-align:center;padding:26px 14px;border:1.5px dashed var(--line);border-radius:20px;background:var(--card);margin-bottom:12px}
.empty b{display:block;font-size:13.5px}.empty p{margin:5px 0 12px;color:var(--mut);font-size:11.5px}
.ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:16px;flex:none}
.task{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--acc));margin-bottom:8px;animation:in .25s ease both;transition:background .3s}
.task.done{background:var(--okbg);border-left-color:var(--ok)}
.task.done .tt{text-decoration:line-through;opacity:.65}
.tt{font-weight:700;font-size:13.5px;overflow-wrap:anywhere}
.ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:15px;transition:all .2s;margin-top:1px}
.task.done .ck{background:var(--ok);border-color:var(--ok);animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.tb{flex:1;min-width:0}
.tm{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.stp{background:var(--inp);border:1px solid var(--line);border-radius:14px;padding:8px;min-width:0}
.stp label{display:block;font-size:10.5px;font-weight:800;color:var(--c);margin-bottom:6px}
.stp div{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stp button{height:36px;border:1px solid var(--line);background:var(--card);border-radius:9px;color:var(--text);font-size:16px;flex:none;cursor:pointer}
.stp input{grid-column:1/-1;order:-1;text-align:center;padding:9px 2px;font-weight:800;font-size:16px}
.bars{display:flex;gap:2px;height:130px;align-items:stretch;margin-top:10px}
.bc{flex:1;min-width:0;display:flex;flex-direction:column}
.bw{flex:1;display:flex;align-items:flex-end;justify-content:center}
.bar2{width:100%;border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.dot{width:3px;height:3px;border-radius:50%;background:var(--mut);opacity:.6;margin-bottom:2px}
.bc s{text-decoration:none;font-size:7.5px;color:var(--mut);text-align:center;height:11px;margin-top:3px}
/* drawer */
#dim{position:fixed;inset:0;background:rgba(8,10,20,.55);opacity:0;pointer-events:none;transition:opacity .28s;z-index:40}
#dim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--card);z-index:41;transform:translate3d(-102%,0,0);transition:transform .3s cubic-bezier(.22,.8,.2,1);display:flex;flex-direction:column;will-change:transform;box-shadow:8px 0 30px rgba(0,0,0,.2)}
#drawer.on{transform:none}
.dh{padding:calc(env(safe-area-inset-top) + 14px) 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.dn{flex:1;min-width:0}.dn b{display:block;font-size:13px}.dn small{color:var(--mut);font-size:10.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
.di{display:flex;align-items:center;gap:11px;padding:10px;border-radius:13px;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:2px;transition:background .15s,transform .12s}
.di:active{transform:scale(.97)}
.di.on{background:var(--soft);color:var(--acc)}
.di .e{width:30px;height:30px;border-radius:10px;background:var(--inp);display:grid;place-items:center;font-size:14px;flex:none}
.di.on .e{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.di span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.di i{color:var(--mut);font-style:normal}
.df{padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line);text-align:center;font-size:10.5px;color:var(--mut)}
/* sheets */
#ov{position:fixed;inset:0;z-index:60;pointer-events:none}
.sb{position:absolute;inset:0;background:rgba(8,10,20,.55);opacity:0;transition:opacity .25s;pointer-events:auto;display:flex;align-items:flex-end;justify-content:center}
.sb.on{opacity:1}
.sheet{width:100%;max-width:600px;max-height:92%;background:var(--card);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translate3d(0,100%,0);transition:transform .3s cubic-bezier(.22,.8,.2,1);will-change:transform}
.sb.on .sheet{transform:none}
.sheet.full{height:100%;max-height:100%;border-radius:0}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;gap:8px}
.sh-h b{font-size:16px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.sh-b{overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;flex:1}
.sh-f{padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);display:flex;gap:8px}
.sh-f .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,30px);background:#111827;color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;font-size:12.5px;opacity:0;transition:all .3s;z-index:90;max-width:88vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#b91c1c}
#fx{position:fixed;inset:0;pointer-events:none;z-index:95;width:100%;height:100%}
/* rich content */
.rich{line-height:1.65;overflow-wrap:anywhere}
.rich h1,.rich h2,.rich h3{margin:16px 0 6px;line-height:1.3}
.rich h1{font-size:19px}.rich h2{font-size:16px}.rich h3{font-size:14.5px}
.rich p{margin:6px 0}.rich ul,.rich ol{padding-left:20px;margin:6px 0}
.rich table{border-collapse:collapse;width:100%;font-size:12.5px;display:block;overflow-x:auto}
.rich th,.rich td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.rich th{background:var(--soft);color:var(--acc)}
.rich code{background:var(--inp);padding:1px 5px;border-radius:6px;font-size:12px}
.rich blockquote{margin:8px 0;padding:6px 12px;border-left:4px solid var(--acc);background:var(--soft);border-radius:0 10px 10px 0}
.rich hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.blk2{border-radius:16px;padding:11px 13px;margin:12px 0;border:1px solid;border-left-width:5px;background:color-mix(in srgb,var(--bc) 9%,var(--card));border-color:color-mix(in srgb,var(--bc) 35%,transparent);border-left-color:var(--bc)}
.blk2>b.bt{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--bc);margin-bottom:3px}
.blk2 p:first-of-type{margin-top:2px}
.sol h2{padding:7px 11px;border-radius:12px;color:var(--hc);background:color-mix(in srgb,var(--hc) 11%,transparent);border-left:4px solid var(--hc);font-size:14px}
.sol h2:nth-of-type(6n+1){--hc:#2563eb}.sol h2:nth-of-type(6n+2){--hc:#7c3aed}.sol h2:nth-of-type(6n+3){--hc:#0891b2}.sol h2:nth-of-type(6n+4){--hc:#d97706}.sol h2:nth-of-type(6n+5){--hc:#059669}.sol h2:nth-of-type(6n+6){--hc:#dc2626}
.svgbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin:10px 0;color:#111}
.svgbox svg{width:100%;height:auto;max-height:460px}
.svgbox+p>i:only-child,.svgbox+p>em:only-child{display:block;text-align:center;font-size:11.5px;color:var(--mut)}
.q-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:11px 12px;margin-top:8px;font:600 13px inherit;font-family:inherit;cursor:pointer;transition:all .15s}
.q-opt.sel{border-color:var(--acc);background:var(--soft)}
.q-opt.right{border-color:var(--ok);background:var(--okbg)}
.q-opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pal button{height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:700 12px inherit;font-family:inherit}
.pal .a{background:var(--ok);color:#fff;border-color:var(--ok)}.pal .m{border-color:#f59e0b;box-shadow:inset 0 0 0 2px #f59e0b}.pal .c{outline:2px solid var(--acc)}
.ring{display:block;margin:6px auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:10px;color:var(--mut)}
.cal button{aspect-ratio:1;border:0;border-radius:12px;background:var(--inp);color:var(--text);font:700 12px inherit;font-family:inherit;position:relative;cursor:pointer}
.cal button.td{outline:2px solid var(--acc)}.cal button.sl{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.cal button u{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:2px;text-decoration:none}
.cal button u i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.8}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.imgs div{position:relative}.imgs img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.imgs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px}
.pv img.big{max-width:100%;border-radius:14px;margin:8px 0;border:1px solid var(--line)}
.tbr{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.spin{width:18px;height:18px;border:2.5px solid color-mix(in srgb,var(--acc) 25%,transparent);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.rm *,.rm{animation-duration:.01ms!important;transition-duration:.01ms!important}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;border:0;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(18px)}
.th{border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;align-items:center;gap:8px;background:var(--inp);cursor:pointer;font-size:11.5px;font-weight:600;transition:all .2s}
.th.on{border-color:var(--acc);background:var(--soft)}
.th i{width:14px;height:14px;border-radius:50%;flex:none}
a.lk{color:var(--acc);font-weight:700}

/* ---- smooth UI additions ---- */
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.992)}to{opacity:1;transform:none}}
#main{overscroll-behavior-y:contain;scroll-behavior:auto}
.rv{animation:none!important;opacity:0;transform:translate3d(0,22px,0) scale(.985)}
.rv.in{opacity:1;transform:none;transition:opacity .55s ease,transform .6s cubic-bezier(.22,.8,.2,1)}
.card,.task,.stat,.btn,.seg button,.q-opt,.cp{-webkit-tap-highlight-color:transparent}
.card{transition:box-shadow .25s,transform .25s}
@keyframes dIn{from{opacity:0;transform:translate3d(-18px,0,0)}to{opacity:1;transform:none}}
@keyframes dHd{from{opacity:0;transform:translate3d(0,-10px,0)}to{opacity:1;transform:none}}
#drawer.on .di{animation:dIn .5s cubic-bezier(.22,.8,.2,1) backwards;animation-delay:calc(min(var(--i,0),14)*28ms + 90ms)}
#drawer.on .dh{animation:dHd .45s cubic-bezier(.22,.8,.2,1) backwards}
#drawer.on .df{animation:dHd .5s ease .5s backwards}
.dm{overscroll-behavior:contain;scroll-behavior:smooth;scroll-padding:12px;-webkit-mask-image:linear-gradient(transparent 0,#000 16px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(transparent 0,#000 16px,#000 calc(100% - 22px),transparent 100%);padding-top:14px;padding-bottom:22px}
.di{transform-origin:left center;will-change:scale,opacity}
.sh-b{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

function cleanSvg(code){try{const d=new DOMParser().parseFromString(code,'image/svg+xml');if(d.querySelector('parsererror'))return'';const r=d.documentElement;if(r.nodeName.toLowerCase()!=='svg')return'';r.querySelectorAll('script,foreignObject,iframe,image,use,style').forEach(n=>n.remove());[r,...r.querySelectorAll('*')].forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value)||/href$/i.test(a.name))n.removeAttribute(a.name)}));if(!r.getAttribute('viewBox'))return'';r.removeAttribute('width');r.removeAttribute('height');return new XMLSerializer().serializeToString(r)}catch(e){return''}}
const BT={definition:['#2563eb','Definition'],concept:['#7c3aed','Important Concept'],formula:['#059669','Formula'],example:['#d97706','Worked Example'],law:['#dc2626','Law / Result'],steps:['#0891b2','Derivation'],summary:['#db2777','Summary & Revision Points'],note:['#64748b','Note']};
function inl(s){return s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function mdBlocks(src){
  const L=esc(src).split('\n'),o=[];let i=0;
  const row=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  while(i<L.length){let l=L[i];
    if(!l.trim()){i++;continue}
    let m;
    if(m=l.match(/^(#{1,3})\s+(.*)/)){o.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){o.push('<hr>');i++;continue}
    if(/^\s*\|/.test(l)&&i+1<L.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1])&&L[i+1].includes('-')){const h=row(l);i+=2;const b=[];while(i<L.length&&/^\s*\|/.test(L[i])){b.push(row(L[i]));i++}o.push(`<table><thead><tr>${h.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${b.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);continue}
    if(/^\s*([-*•]|\d+[.)])\s+/.test(l)){const ord=/^\s*\d/.test(l);const it=[];while(i<L.length&&/^\s*([-*•]|\d+[.)])\s+/.test(L[i])){it.push(`<li>${inl(L[i].replace(/^\s*([-*•]|\d+[.)])\s+/,''))}</li>`);i++}o.push(`<${ord?'ol':'ul'}>${it.join('')}</${ord?'ol':'ul'}>`);continue}
    if(/^&gt;\s?/.test(l)){const q=[];while(i<L.length&&/^&gt;\s?/.test(L[i])){q.push(inl(L[i].replace(/^&gt;\s?/,'')));i++}o.push(`<blockquote>${q.join('<br>')}</blockquote>`);continue}
    const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,3}\s|\s*\||\s*([-*•]|\d+[.)])\s|&gt;)/.test(L[i])){p.push(inl(L[i]));i++}
    if(p.length)o.push(`<p>${p.join('<br>')}</p>`);else i++;
  }
  return o.join('');
}
function rich(src){
  let s=String(src||'');const M=[],B=[],V=[];
  s=s.replace(/```svg\s*([\s\S]*?)```/g,(_,c)=>{V.push(cleanSvg(c));return`\n\u0002${V.length-1}\u0002\n`});
  const mk=(d)=>(_,m)=>{M.push([m,d]);return'\u0000'+(M.length-1)+'\u0000'};
  s=s.replace(/\$\$([\s\S]+?)\$\$/g,mk(true)).replace(/\\\[([\s\S]+?)\\\]/g,mk(true)).replace(/\\\(([\s\S]+?)\\\)/g,mk(false)).replace(/\$([^\n$]+?)\$/g,mk(false));
  s=s.replace(/^:::(\w+)[ \t]*(.*)\n([\s\S]*?)\n:::[ \t]*$/gm,(_,t,title,body)=>{const b=BT[t.toLowerCase()]||BT.note;B.push(`<div class="blk2" style="--bc:${b[0]}"><b class="bt">${b[1]}${title?' — '+esc(title):''}</b>${mdBlocks(body)}</div>`);return`\n\u0001${B.length-1}\u0001\n`});
  let h=mdBlocks(s);
  h=h.replace(/\u0001(\d+)\u0001/g,(_,i)=>B[i]).replace(/<p>\u0002(\d+)\u0002<\/p>/g,(_,i)=>V[i]?`<div class="svgbox">${V[i]}</div>`:'').replace(/\u0002(\d+)\u0002/g,(_,i)=>V[i]?`<div class="svgbox">${V[i]}</div>`:'');
  const fx=(m,d)=>{try{if(window.katex)return katex.renderToString(m,{displayMode:d,throwOnError:false,strict:false,trust:false})}catch(e){}return`<code>${esc(m)}</code>`};
  h=h.replace(/\u0000(\d+)\u0000/g,(_,i)=>{const[m,d]=M[i];return fx(m.replace(/&amp;/g,'&'),d)});
  return`<div class="rich">${h}</div>`;
}

    const gap=AIQ.last+350-now;if(gap>0){await aiSleep(gap,sig);continue}

  }
}
const aiRelease=()=>{AIQ.act=Math.max(0,AIQ.act-1)};

    }

      try{const ej=await r.json();msg=(ej.error&&ej.error.message)||'';const det=(ej.error&&ej.error.details)||[];const ri=det.find(d=>d.retryDelay);if(ri)delay=parseFloat(ri.retryDelay)*1000||0;if(/PerDay|per day|daily/i.test(JSON.stringify(ej)))quotaDay=true}catch(e){}

      if(r.status===400)throw new Error('AI rejected the request. '+(msg||'Try a shorter question.'));
      if(r.status===429||r.status===500||r.status===503||r.status===502){

        if(quotaDay&&r.status===429){mi++;tries=0;continue}
        if(++tries<=(r.status===429?1:2)&&(delay===0||delay<=12000)){await aiSleep(Math.max(delay,1500*tries),signal);continue}
        mi++;tries=0;continue;
      }

    }

    aiRelease();

async function aiStream(contents,o){
  const {sys,signal,max,timeout,onText,think,json}=o;const model=o.model||D.prof.model||'gemini-3.5-flash';
  const body={contents,generationConfig:{temperature:.5,maxOutputTokens:max||6000}};
  if(sys)body.systemInstruction={parts:[{text:sys}]};
  if(json){body.generationConfig.responseMimeType='application/json';body.generationConfig.temperature=.4}
  if(/2\.5-flash/.test(model))body.generationConfig.thinkingConfig={thinkingBudget:think==null?0:think};
  else if(/gemini-3/.test(model))body.generationConfig.thinkingConfig={thinkingLevel:think>0?'low':'minimal'};
  const ctl=new AbortController(),onAbort=()=>ctl.abort('user');if(signal)signal.addEventListener('abort',onAbort,{once:true});
  const to=setTimeout(()=>ctl.abort('timeout'),timeout||120000);let txt='';
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':D.prof.key},body:JSON.stringify(body),signal:ctl.signal});
    if(!r.ok||!r.body)throw new Error('http '+r.status);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){const ln=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!ln.startsWith('data:'))continue;
        try{const j=JSON.parse(ln.slice(5)),ps=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[],add=ps.filter(x=>!x.thought).map(x=>x.text||'').join('');if(add){txt+=add;onText&&onText(txt)}}catch(e){}}}
    if(!txt.trim())throw new Error('empty');return txt;
  }catch(e){
    if(ctl.signal.reason==='user'||(signal&&signal.aborted))throw new Error('Cancelled');
    if(txt.length>1500)return txt;throw e;
  }finally{clearTimeout(to);if(signal)signal.removeEventListener('abort',onAbort)}
}

function weakMetrics(){
 const map={};
 const get=id=>map[id]||(map[id]={chap:id,subj:(chap(id)||{}).subj||'Other',total:0,correct:0,errors:0,entries:[],dpp:0,backlog:0});
 D.tests.forEach(t=>{const id=t.chap||t.chapter||t.chapId;if(!id)return;const x=get(id),total=num(t.total||t.questions||t.qTotal),score=num(t.correct||t.right||t.score);if(total>0){x.total+=total;x.correct+=Math.min(total,score);x.entries.push({date:t.date||t.createdAt||'',acc:score/total*100})}});
 D.dpps.forEach(d=>{if(!d.chap)return;const x=get(d.chap);x.dpp++;const a=num(d.att),c=Math.max(num(d.cor),num(d.c2));if(a>0){x.total+=a;x.correct+=Math.min(a,c);x.entries.push({date:d.date||d.doneOn||'',acc:c/a*100})}});
 D.errors.filter(e=>e.status!=='Mastered').forEach(e=>{if(e.chap)get(e.chap).errors++});
 D.backlog.filter(b=>!b.done&&b.chap).forEach(b=>get(b.chap).backlog++);
 return D.chaps.map(c=>{const x=map[c.id]||{chap:c.id,subj:c.subj,total:0,correct:0,errors:0,entries:[],dpp:0,backlog:0};x.name=c.name;x.accuracy=x.total?Math.round(x.correct/x.total*100):null;x.entries.sort((a,b)=>String(a.date).localeCompare(String(b.date)));const last=x.entries.slice(-3);x.trend=last.length>=2?(last[last.length-1].acc>last[0].acc+2?'Improving':last[last.length-1].acc<last[0].acc-2?'Declining':'Stable'):'Not enough data';x.rank=x.accuracy==null?'Not enough data':x.accuracy<50?'Weak':x.accuracy<=75?'Average':'Strong';return x}).sort((a,b)=>(a.accuracy??-1)-(b.accuracy??-1)||b.errors-a.errors);
}

}

function hedged(models,run,userSig,onText,onWin){
  return new Promise((res,rej)=>{
    const cs=[],tm=[];let win=-1,started=0,failed=0,last=null,done=false;
    const stopAll=k=>{tm.forEach(clearTimeout);cs.forEach((c,j)=>{if(j!==k)c.abort()})};
    if(userSig)userSig.addEventListener('abort',()=>{if(done)return;done=true;stopAll(-1);rej(new Error('Cancelled'))},{once:true});
    const go=()=>{if(done||started>=models.length)return;const i=started++,c=new AbortController();cs[i]=c;
      run(models[i],c.signal,t=>{if(done)return;if(win<0){win=i;stopAll(i);onWin&&onWin(i)}if(win===i)onText&&onText(t)})
       .then(r=>{if(done)return;if(win<0||win===i){if(win<0)onWin&&onWin(i);done=true;stopAll(i);res(r)}})
       .catch(e=>{if(done||(win>=0&&win!==i))return;last=e;failed++;if(win===i){done=true;rej(e)}else if(started<models.length)go();else if(failed>=started){done=true;rej(last)}});
      if(started<models.length)tm.push(setTimeout(()=>{if(win<0)go()},9000))};
    go()})}

/* ===== Rank predictor: rank only, recalculated daily from real activity ===== */
window.rankCalc=function(){
  const t=today(),days=[];for(let i=0;i<30;i++){const d=new Date();d.setDate(d.getDate()-i);days.push(dstr(d))}
  const from=days[29],inR=k=>!!k&&k>=from&&k<=t,S=[];
  const tk=D.tasks.filter(x=>inR(x.date));if(tk.length>=3)S.push([.12,tk.filter(x=>x.done).length/tk.length]);
  S.push([.2,Math.min(1,sum(days,k=>D.prog[k]?qsn(D.prog[k]):0)/30/60)]);
  const dp=D.dpps.filter(x=>inR(x.date)),att=sum(dp,x=>num(x.att));if(att>=10)S.push([.18,Math.min(1,sum(dp,x=>num(x.cor))/att)]);
  const ts=D.tests.filter(x=>inR(x.date||x.at));if(ts.length)S.push([.12,Math.min(1,sum(ts,x=>num(x.pct!=null?x.pct:(x.total?num(x.score)/num(x.total)*100:0)))/ts.length/100)]);
  {const cl=num(D.prof.errCleared);if(D.errors.length+cl>=3)S.push([.14,(D.errors.filter(e=>e.status==='Mastered'||e.status==='Resolved').length+cl)/(D.errors.length+cl)])}
  if(D.backlog.length)S.push([.12,D.backlog.filter(b=>b.status==='Done'||b.doneOn).length/D.backlog.length]);
  const W=sum(S,x=>x[0]),R=W?sum(S,x=>x[0]*x[1])/W:0;
  const mk=D.mocks.filter(m=>!String(m.kind||'').toLowerCase().includes('advanced')).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).slice(-3)
    .map(m=>{const sc=num(m.p)+num(m.c)+num(m.m),mx=num(m.max)||300;return sc/mx*300});
  const M=mk.length?sum(mk)/mk.length:null;
  const eq=Math.max(0,Math.min(300,M!=null?M*(.85+.3*R):R*300*.55));
  const tb=((D.rankMap&&D.rankMap.main)||[]).map(x=>({s:num(x.score),r:Math.max(1,num(x.rank))})).sort((a,b)=>b.s-a.s);
  let rank=null;if(tb.length){if(eq>=tb[0].s)rank=tb[0].r;else if(eq<=tb[tb.length-1].s)rank=tb[tb.length-1].r;else{for(let i=0;i<tb.length-1;i++){const a=tb[i],b=tb[i+1];if(eq<=a.s&&eq>=b.s){const k=a.s===b.s?0:(a.s-eq)/(a.s-b.s);rank=Math.exp(Math.log(a.r)+k*(Math.log(b.r)-Math.log(a.r)));break}}}}
  return{rank,eq:Math.round(eq),R};
};

const rtClean=t=>String(t||'').replace(/```svg[\s\S]*?```/g,'[figure omitted]').trim().slice(0,1500);
async function genRetest(es,cfg,signal,onProg){
  const chunks=[];for(let i=0;i<es.length;i+=5)chunks.push(es.slice(i,i+5));
  const results=chunks.map(()=>({}));let done=0,next=0;
  const run=async ci=>{
    const ch=chunks[ci],have=results[ci];
    for(let tries=0;tries<2;tries++){
      if(signal.aborted)throw new Error('Cancelled');
      const miss=ch.map((e,i)=>i).filter(i=>!have[i]);if(!miss.length)break;
      const list=miss.map((ix,k)=>{const e=ch[ix];return`${k+1}. [${e.subj} · ${chapName(e.chap)}${e.topic?' · '+e.topic:''}] ${rtClean(e.q)}${e.att?'\n   Student chose: '+String(e.att).slice(0,200):''}${e.ans?'\n   Correct answer noted: '+String(e.ans).slice(0,200):''}${e.cat&&e.cat!=='Unclassified'?'\n   Mistake type: '+e.cat:''}${e.notes?'\n   Notes: '+String(e.notes).slice(0,300):''}`}).join('\n\n');
      const msg=`Below are ${miss.length} question(s) the student got WRONG. For EACH numbered mistake write ONE brand-new ${PAT[cfg.pat].name}-style practice question that tests the SAME concept and the same error-prone step, with different numbers/context (never copy the original). Return EXACTLY ${miss.length} item(s) in the same order. In every item set "ch" to the mistake's number (1-${miss.length}) it is based on. Choose "type" from the allowed types that fits best (mostly single-correct).\n\nMISTAKES:\n${list}`;
      try{
        const t=await smartGen([{role:'user',parts:[{text:msg}]}],{sys:tSys(cfg.pat,cfg.lang,cfg.diff),json:true,think:1,max:5000,timeout:80000,signal});
        let j;try{j=parseJ(t)}catch(e){continue}
        const v=valQ(j,cfg.pat),okCh=v.length&&new Set(v.map(q=>q.ch)).size===v.length&&v.every(q=>q.ch>=1&&q.ch<=miss.length);
        v.forEach((q,ix)=>{const k=okCh?q.ch-1:ix;if(k<miss.length&&!have[miss[k]])have[miss[k]]=q});
      }catch(e){if(e.message==='NOKEY'||e.message==='Cancelled')throw e;if(/Rate limit/i.test(e.message)){await sleep(9000);continue}if(tries===1&&!Object.keys(have).length)throw e}
    }
    done+=ch.length;onProg&&onProg(Math.min(done,es.length),es.length);
  };
  const worker=async()=>{while(next<chunks.length){const ci=next++;await run(ci)}};
  await Promise.all([worker(),worker(),worker()]);
  const qs=[];
  chunks.forEach((ch,ci)=>ch.forEach((e,i)=>{const q=results[ci][i];if(!q)return;q.subj=e.subj;q.cid=e.chap||'';q.errId=e.id;if(!q.topic||q.topic==='General')q.topic=e.topic||q.topic;qs.push(q)}));
  return shufBySubj(qs);
}
A.startRetest=async()=>{
  const out=$('#rtOut');if(!out)return;

  try{

  }
};
function rtApply(T0){

    const e=D.errors.find(x=>x.id===q.errId);if(!e)return;

  });

  removed.forEach(e=>{if(e.chap)scheduleSpaced(e.chap,e.subj,e.topic,'error-mastered')});
  D.errors=D.errors.filter(e=>!ids.has(e.id));

  return{removed:removed.length,kept,skipped,keptIds};
}

<script type="text/plain" class="app-src">
/* ===== Book Library: import your own PDFs (stored only on this device) → AI reads relevant pages ===== */
(function(){
const PJ='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const BKI={};let _pj=null;
const bks=()=>{if(!Array.isArray(D.books))D.books=[];return D.books};
const bkCfg=()=>Object.assign({theory:true,tests:true,tutor:true},D.prof.bookUse||{});
const tick=()=>new Promise(r=>setTimeout(r,0));

/* ---- IndexedDB (separate DB, so the big files never touch the app's main save) ---- */
const odb=()=>new Promise((res,rej)=>{const r=indexedDB.open('mi28books',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('text');d.createObjectStore('file')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbPut=async(st,k,v)=>{const d=await odb();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).put(v,k);t.oncomplete=()=>{d.close();res()};t.onerror=()=>{d.close();rej(t.error)};t.onabort=()=>{d.close();rej(t.error||new Error('Storage full'))}})};
const idbGet=async(st,k)=>{const d=await odb();return new Promise((res,rej)=>{const t=d.transaction(st,'readonly').objectStore(st).get(k);t.onsuccess=()=>{d.close();res(t.result)};t.onerror=()=>{d.close();rej(t.error)}})};
const idbDel=async(st,k)=>{const d=await odb();return new Promise(res=>{const t=d.transaction(st,'readwrite');t.objectStore(st).delete(k);t.oncomplete=()=>{d.close();res()};t.onerror=()=>{d.close();res()}})};

/* ---- pdf.js (loaded on demand) ---- */
async function pdfjs(){
  if(_pj)return _pj;
  if(!window.pdfjsLib)await new Promise((res,rej)=>{const s=document.createElement('script');s.src=PJ+'pdf.min.js';s.onload=res;s.onerror=()=>rej(new Error('PDF reader could not load — check your internet'));document.head.appendChild(s)});
  const w=await(await fetch(PJ+'pdf.worker.min.js')).text();
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));
  return _pj=window.pdfjsLib;
}
async function pageText(doc,p){
  const pg=await doc.getPage(p),tc=await pg.getTextContent();let y=null,s='';
  tc.items.forEach(it=>{const yy=it.transform?it.transform[5]:0;if(y!==null&&Math.abs(yy-y)>3)s+='\n';else if(s&&!/\s$/.test(s))s+=' ';s+=it.str;y=yy});
  pg.cleanup();return s.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}

/* ---- search index (BM25-lite, built in memory when first needed) ---- */
const STOP=new Set('the of and an to in is are for on with as by at from that this which it its be or was were has have had not but can will all any one two use used using given find then than also their there these those when where what how'.split(' '));
const stem=w=>w.length>4?w.replace(/ies$/,'y').replace(/(ing|ed|es|s)$/,''):w;
const tok=s=>(String(s).toLowerCase().match(/[a-z][a-z]{2,}/g)||[]).filter(w=>!STOP.has(w)).map(stem);
async function bkIndex(id){
  if(BKI[id])return BKI[id];
  const pages=await idbGet('text',id);if(!pages||!pages.length)return null;
  const tf=[],df=new Map();let tl=0,tc=0;
  pages.forEach(p=>{const m=new Map();let L=0;tok(p).forEach(w=>{m.set(w,(m.get(w)||0)+1);L++});tf.push({m,L});tl+=L;tc+=p.length;m.forEach((_,w)=>df.set(w,(df.get(w)||0)+1))});
  return BKI[id]={pages,tf,df,avg:tl/pages.length||1,avgC:tc/pages.length||1500};
}
function bkSearch(ix,query,k){
  const q=[...new Set(tok(query))];if(!q.length)return[];const N=ix.pages.length,sc=[];
  const skipTo=Math.ceil(N*.03);
  ix.tf.forEach((pg,i)=>{
    if(i<skipTo||/^\s*(table of )?contents\b/i.test(ix.pages[i].slice(0,120))){return}
    let s=0,hit=0;q.forEach(w=>{const f=pg.m.get(w);if(!f)return;hit++;const idf=Math.log(1+(N-(ix.df.get(w)||0)+.5)/((ix.df.get(w)||0)+.5));s+=idf*f*2.2/(f+1.2*(.25+.75*pg.L/ix.avg))});
    if(s>0){const head=new Set(tok(ix.pages[i].slice(0,220)));let h=0;q.forEach(w=>{if(head.has(w))h++});s*=1+.6*h/q.length}
    sc.push([i+1,s,hit])});
  sc.sort((a,b)=>b[1]-a[1]);
  if(!sc.length||sc[0][2]<Math.min(2,q.length))return[];
  const top=sc.slice(0,k).filter(x=>x[1]>=sc[0][1]*.3).map(x=>x[0]),set=new Set(top);
  top.slice(0,Math.min(4,top.length)).forEach(p=>{if(p<N)set.add(p+1)});
  return[...set].sort((a,b)=>a-b);
}
const pickPages=(from,to,k,random)=>{
  const all=[];for(let p=from;p<=to;p++)all.push(p);if(all.length<=k)return all;
  if(random)return shuf2(all.slice()).slice(0,k).sort((a,b)=>a-b);
  const out=[];for(let i=0;i<k;i++)out.push(all[Math.round(i*(all.length-1)/Math.max(1,k-1))]);return[...new Set(out)];
};
const shuf2=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const spans=pg=>{if(!pg.length)return'';const r=[];let s=pg[0],p=pg[0];for(let i=1;i<=pg.length;i++){if(pg[i]!==p+1){r.push(s===p?''+s:s+'–'+p);s=pg[i]}p=pg[i]}return r.join(', ')};

async function render(id,pages){
  const blob=await idbGet('file',id);if(!blob)return[];
  const pj=await pdfjs(),url=URL.createObjectURL(blob),imgs=[];
  try{
    const doc=await pj.getDocument({url,disableAutoFetch:true}).promise;
    for(const p of pages){
      const pg=await doc.getPage(Math.min(p,doc.numPages)),vp=pg.getViewport({scale:1.5}),cv=document.createElement('canvas');
      cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      imgs.push({inlineData:{mimeType:'image/jpeg',data:cv.toDataURL('image/jpeg',.6).split(',')[1]}});pg.cleanup();
    }
    doc.destroy();
  }finally{URL.revokeObjectURL(url)}
  return imgs;
}
const RULE='REFERENCE BOOK EXCERPTS — use them ONLY as a guide to syllabus scope, depth, terminology and teaching order. Explain everything in your OWN words (never copy sentences). Never reproduce the book’s own exercise or worked problems — write new, original ones. Ignore scanning/OCR noise. If something needed is missing from the excerpts, use your own knowledge.';

/* ---- public API used by theory / tests / doubts ---- */
window.BK={
  async ctx(subj,chapIds,o={}){
    const out={text:'',imgs:[],src:'',need:[]};
    try{
      const key=o.mode==='test'?'tests':o.mode==='tutor'?'tutor':'theory';
      if(!bkCfg()[key])return out;
      const books=bks().filter(b=>b.on!==false&&b.subj===subj);if(!books.length||!chapIds.length)return out;
      const per=Math.floor((o.maxChars||20000)/chapIds.length/books.length),blocks=[],srcs=new Set();let imgLeft=o.maxImgs||0;
      for(const id of chapIds){
        const cn=chapName(id);
        for(const b of books){
          const rg=(b.ranges||{})[id];
          if(b.scanned){
            if(!rg){out.need.push(b.title+' → '+cn);continue}
            if(imgLeft<=0)continue;
            const n=Math.max(1,Math.min(imgLeft,Math.ceil(imgLeft/chapIds.length))),pg=pickPages(rg[0],rg[1],n,o.mode==='test');
            const im=await render(b.id,pg);if(im.length){out.imgs.push(...im);imgLeft-=im.length;srcs.add(b.title);blocks.push(`<reference chapter="${cn}" book="${b.title}" pages="${spans(pg)}">(page images attached, in order)</reference>`)}
            continue;
          }
          const ix=await bkIndex(b.id);if(!ix){out.need.push(b.title+' (data missing on this device — re-import)');continue}
          const K=Math.max(3,Math.min(40,Math.round(per/ix.avgC)));
          let pg=rg?pickPages(Math.max(1,rg[0]),Math.min(ix.pages.length,rg[1]),K,o.mode==='test'):bkSearch(ix,cn+' '+(o.focus||''),K);
          if(!pg.length)continue;
          let txt='',used=[];for(const p of pg){const t=`[p.${p}]\n${ix.pages[p-1]}\n\n`;if(txt.length+t.length>per){if(!txt){txt=t.slice(0,per)+'\n\n';used.push(p)}break}txt+=t;used.push(p)}
          if(txt){srcs.add(b.title);blocks.push(`<reference chapter="${cn}" book="${b.title}" pages="${spans(used)}">\n${txt}</reference>`)}
        }
      }
      if(blocks.length){out.text=RULE+'\n'+blocks.join('\n')+'\n\n';out.src=[...srcs].join(', ')}
    }catch(e){console.warn('BK.ctx',e)}
    return out;
  },
  async ctxQuery(q){
    try{
      if(!bkCfg().tutor||!q||q.length<8)return'';
      const books=bks().filter(b=>b.on!==false&&!b.scanned);if(!books.length)return'';
      let best=[];
      for(const b of books){const ix=await bkIndex(b.id);if(!ix)continue;bkSearch(ix,q,4).slice(0,4).forEach(p=>best.push({b,p,ix}))}
      if(!best.length)return'';
      let txt='',n=0;for(const x of best){const t=`<reference book="${x.b.title}" page="${x.p}">\n${x.ix.pages[x.p-1].slice(0,2200)}\n</reference>\n`;if(txt.length+t.length>9000)break;txt+=t;n++}
      return n?`${RULE}\n${txt}\nStudent’s doubt:\n`:'';
    }catch(e){return''}
  }
};

<script type="text/plain" class="app-src">
/* ===== v4: Error-reason tags + weekly report · Mock trend chart · Instant theory cache ===== */
(function(){
/* ---------- Error Book: reason tags + weekly weak-topic report ---------- */
C.rtTag=(d,el)=>{const e=D.errors.find(x=>x.id===d.id);if(!e)return;e.cat=el.value;save();toast('Tagged: '+el.value)};
const tipFor={'Conceptual mistake':'Concept dubara padho (theory + 2 solved examples), phir 5 basic questions.','Formula mistake':'Is chapter ki formula sheet banao aur roz subah 1 baar bina dekhe likho.','Calculation mistake':'Steps likhke solve karo, mental calculation kam. 10 calculation drills roz.','Misread question':'Question 2 baar padho aur given/asked underline karo.','Incorrect method':'Same type ke 3 solved examples dekho, phir method ko apne words me likho.','Time-management issue':'Timed practice: har question par max 2–3 min, atak jao to skip.','Unclassified':'Pehle in mistakes ko reason ke saath tag karo — tabhi sahi plan banega.'};
const winStart=n=>{const d=new Date(Date.now()-3*3600000);d.setDate(d.getDate()-n);return dstr(d)};
function errReport(){
  const t=today(),since=winStart(6);
  const open=D.errors.filter(e=>e.status!=='Mastered'),newE=D.errors.filter(e=>(e.date||'')>=since&&(e.date||'')<=t);
  const rts=D.tests.filter(x=>x.retest&&x.date>=since),cleared=sum(rts,x=>num(x.retest.removed)),tried=sum(rts,x=>num(x.retest.removed)+num(x.retest.kept));
  if(!D.errors.length&&!cleared)return'<div class="empty"><b>Error Book khaali hai</b><p>Mistakes log karo, phir yahan weekly report milegi.</p></div>';
  const cat={};open.forEach(e=>{const k=e.cat||'Unclassified';cat[k]=(cat[k]||0)+1});
  const cats=Object.entries(cat).sort((a,b)=>b[1]-a[1]),tot=open.length||1;
  const ch={};open.forEach(e=>{const k=e.chap||'';if(!k)return;const o=ch[k]=ch[k]||{n:0,f:0,s:e.subj};o.n++;o.f+=(e.retestHistory||[]).filter(h=>h&&h.correct===false).length});
  const weak=Object.entries(ch).map(([k,v])=>({k,...v,score:v.n+v.f*.5})).sort((a,b)=>b.score-a.score).slice(0,6);
  const subj=SUBJ.map(s=>[s,open.filter(e=>e.subj===s).length]);
  const topCat=cats.find(c=>c[0]!=='Unclassified')||cats[0];
  const unt=cat['Unclassified']||0;
  return`<div class="card"><div class="eyebrow">LAST 7 DAYS</div><div class="g3 mt8"><div class="stat"><small>New mistakes</small><b style="font-size:18px">${newE.length}</b></div><div class="stat"><small>Cleared (retest)</small><b style="font-size:18px;color:var(--ok)">${cleared}</b></div><div class="stat"><small>Open now</small><b style="font-size:18px;color:var(--bad)">${open.length}</b></div></div>${tried?`<div class="sub mt8">Retest accuracy this week: <b>${pct(cleared,tried)}%</b> (${cleared}/${tried})</div>`:'<div class="sub mt8">Is hafte koi retest nahi diya — “Retest my mistakes” try karo.</div>'}</div>
<div class="card"><b>🏷️ Kyun galat hota hai (open mistakes)</b>${cats.length?cats.map(([k,v])=>`<div class="mt8"><div class="row sp"><span style="overflow-wrap:anywhere">${esc(k)}</span><b>${v} · ${pct(v,tot)}%</b></div>${bar(pct(v,tot))}</div>`).join(''):'<div class="sub mt8">Koi open mistake nahi 🎉</div>'}${topCat?`<div class="sub mt8" style="line-height:1.55">👉 <b>${esc(topCat[0])}</b>: ${esc(tipFor[topCat[0]]||'')}</div>`:''}${unt?`<div class="sub mt8">⚠️ ${unt} mistake${unt>1?'s':''} abhi untagged hain — Error Book me reason select karo.</div>`:''}</div>
<div class="card"><b>📉 Weak chapters (focus yahan)</b>${weak.length?weak.map(w=>`<div class="row sp mt8" style="gap:8px"><div style="min-width:0"><b style="overflow-wrap:anywhere">${esc(chapName(w.k))}</b><div class="sub"><span style="color:${sc(w.s)};font-weight:700">${esc(w.s)}</span> · ${w.n} open${w.f?' · '+w.f+' retest fail':''}</div></div><button class="btn sec sm" style="flex:none" data-a="rtChapter" data-ch="${esc(w.k)}" data-s="${esc(w.s)}">🧪 Retest</button></div>`).join(''):'<div class="sub mt8">Chapter-wise data abhi nahi hai.</div>'}</div>
<div class="card"><b>📚 Subject-wise open mistakes</b><div class="g3 mt8">${subj.map(([s,n])=>`<div class="stat"><small style="color:${sc(s)}">${s}</small><b style="font-size:18px">${n}</b></div>`).join('')}</div></div>`;
}
A.errReport=()=>sheet('📊 Weekly Error Report',errReport(),{full:true});
A.rtChapter=d=>{A.retestErrors();const s=$('#rtSub'),c=$('#rtChap');if(!s||!c)return;s.value=d.s;C.rtSub({},s);c.value=d.ch;C.rtUpd()};

/* ---------- Mock Test Scores: full trend chart ---------- */
function trendChart(a){
  a=a.slice(-12);const W=330,H=190,L=30,Rr=10,Tp=12,B=26,iw=W-L-Rr,ih=H-Tp-B;
  const subP=(m,s)=>Math.round(num(m[SK[s]])/((num(m.max)||300)/3)*100);
  const ser=[{n:'Total',c:'var(--acc)',v:a.map(m=>Math.round(mTot(m)/(num(m.max)||300)*100)),w:3}].concat(SUBJ.map(s=>({n:s,c:sc(s),v:a.map(m=>subP(m,s)),w:1.8})));
  const all=ser.flatMap(x=>x.v),mn=Math.min(0,...all),mx=Math.max(100,...all);
  const X=i=>L+(a.length===1?iw/2:i*iw/(a.length-1)),Y=v=>Tp+ih-(v-mn)/(mx-mn)*ih;
  const grid=[0,25,50,75,100].filter(v=>v>=mn&&v<=mx).map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="var(--mut)">${v}</text>`).join('');
  const step=a.length>7?2:1,xl=a.map((m,i)=>i%step?'':`<text x="${X(i)}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--mut)">${new Date(m.date+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</text>`).join('');
  const lines=ser.slice().reverse().map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="${s.w}" stroke-linejoin="round" stroke-linecap="round" opacity="${s.n==='Total'?1:.85}" points="${s.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${s.v.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${s.n==='Total'?3.6:2.4}" fill="${s.c}"/>`).join('')}`).join('');
  const lab=a.length<=8?ser[0].v.map((v,i)=>`<text x="${X(i)}" y="${Y(v)-7}" font-size="9" font-weight="700" text-anchor="middle" fill="var(--text)">${v}%</text>`).join(''):'';
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${lines}${lab}${xl}</svg>`;
  const legend=`<div class="row wr" style="gap:10px;margin-top:4px">${ser.map(s=>`<span class="sub" style="display:inline-flex;align-items:center;gap:4px"><i style="width:10px;height:10px;border-radius:50%;background:${s.c};display:inline-block"></i>${s.n}</span>`).join('')}</div>`;
  let delta='',ins='';
  if(a.length>1){const n=a.length;const d=ser.map(s=>({n:s.n,c:s.c,d:s.v[n-1]-s.v[n-2]}));
    delta=`<div class="row wr mt8" style="gap:6px">${d.map(x=>`<span class="chip ${x.d>=0?'ok':'bad'}" style="font-size:10.5px">${x.n} ${x.d>=0?'▲ +':'▼ '}${x.d}</span>`).join('')}</div><div class="sub">Pichle mock ke mukable (% points)</div>`;
    const sd=d.slice(1),best=sd.slice().sort((x,y)=>y.d-x.d)[0],worst=sd.slice().sort((x,y)=>x.d-y.d)[0];
    ins=`<div class="sub mt8" style="line-height:1.55">${best.d>0?`📈 Sabse zyada sudhar: <b>${best.n}</b> (+${best.d}). `:''}${worst.d<0?`⚠️ Gir raha hai: <b>${worst.n}</b> (${worst.d}).`:'Koi subject gira nahi 👍'}</div>`}
  return`<label class="l">Score trend (% of max, last ${a.length} mocks)</label>${svg}${legend}${delta}${ins}`;
}
const _mocks=R.mocks;
R.mocks=function(){
  const h=_mocks(),k=tab('mk','JEE Main'),a=D.mocks.filter(m=>m.kind===k).sort((x,y)=>String(x.date).localeCompare(String(y.date)));
  if(a.length<2)return h;
  return h.replace(/<label class="l">Score trend \(% of max\)<\/label><svg[\s\S]*?<\/svg><div class="sub">Change since first test:[\s\S]*?<\/div>/,trendChart(a)+`<div class="sub mt8">Pehle mock se ab tak: <b>${(()=>{const f=Math.round(mTot(a[0])/(num(a[0].max)||300)*100),l=Math.round(mTot(a[a.length-1])/(num(a[a.length-1].max)||300)*100);return(l-f>=0?'+':'')+(l-f)})()} points</b></div>`);
};

/* ---------- Instant theory cache (same chapter + language + books → opens instantly) ---------- */
const THC={
  key(subj,chap,mode,lang,focus){
    if(focus)return null;
    const bk=(D.books||[]).filter(b=>b.on!==false&&b.subj===subj).map(b=>b.id+':'+JSON.stringify((b.ranges||{})[chap]||0)).join(',');
    return[subj,chap,mode,lang,(D.prof.bookUse||{}).theory===false?'nb':bk].join('|');
  },
  get(k){if(!k||!D.aiCache)return null;const e=D.aiCache[k];return e&&e.t?e.t:null},
  set(k,t){
    if(!k||!t||t.length<300)return;
    D.aiCache=D.aiCache||{};D.aiCache[k]={t,at:Date.now()};
    const ks=Object.keys(D.aiCache);
    if(ks.length>40)ks.sort((a,b)=>D.aiCache[a].at-D.aiCache[b].at).slice(0,ks.length-40).forEach(x=>delete D.aiCache[x]);
    save();
  }
};
window.THC=THC;
})();

(function(){
  window.__IDB=null;
  const open=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('mi28',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
  window.__idbPut=async v=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,'D');t.oncomplete=()=>{db.close();res()};t.onerror=t.onabort=()=>{db.close();rej(t.error)}})};
  const get=async()=>{const db=await open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get('D');q.onsuccess=()=>{db.close();res(q.result||null)};q.onerror=()=>{db.close();rej(q.error)}})};
  const start=()=>{document.querySelectorAll('script.app-src').forEach(o=>{const n=document.createElement('script');n.textContent=o.textContent;document.body.appendChild(n)})};
  Promise.race([get().catch(()=>null),new Promise(r=>setTimeout(()=>r(null),3000))]).then(v=>{window.__IDB=v}).finally(start);
})();
</script>
</body>
</html>
